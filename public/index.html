<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Ecommerce</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="flex-sec">
        <h class="Titulo">Venda Online.</h>
        <input type="text" name="" id="search">
        <select id="category">
            <option id="Todas">Todas</option>
        </select>
        <button id="btnRender">Renderizar</button>

    </header>
    <section> 
        
        <article class="holder" id="product-list">
            <div id="Fiat Strada" class="4">
                <div class="product"> 
                    <img class="img_config" src="imgs/Strada.jpg" alt=""> 
                    <p class="font_config">Fiat Sdtrada </p>
                    <p class="font_config">R$98999.99 
                    <button class="font_config botao_pos">Ver Detalhes</button>
                </p>
                <div class="detalhes">

                </div>
            </div>
        </article>
        
    </section>
</body>
</html>
